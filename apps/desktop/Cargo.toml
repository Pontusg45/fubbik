[package]
name = "fubbik-desktop"
edition = "2024"
version = "0.1.0"
description = "Desktop project manager for fubbik: registered repos, their processes, databases and status"
publish = false

# Its own workspace, so GPUI (and its X11/Wayland stack on Linux) stays out of
# `cargo build --workspace` and CI for the crates under `crates/`.
[workspace]

[[bin]]
name = "fubbik-desktop"
path = "src/main.rs"

[dependencies]
# `runtime_shaders` compiles the Metal shaders when the app starts, so building
# does not need Xcode's separate Metal Toolchain download.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Local HTTP only (health checks, the fubbik API), so no TLS stack.
ureq = { version = "3", default-features = false, features = ["json"] }
# The embedded terminal: Ghostty's VT engine (pre-1.0, so pinned exactly;
# building it needs Zig 0.17 on PATH) and a PTY for the shell.
libghostty-vt = "=0.2.2"
portable-pty = "0.9"
# Wakes the UI when a PTY has output (instead of a timer per terminal).
async-channel = "2"
# Re-polls when services files or Claude's live-session registry change.
notify = "8"

# The embedded backend: the fubbik API in-process (`backend.rs`), from the
# main workspace's crates. Their sqlx queries build from the checked-in
# `.sqlx/` data (SQLX_OFFLINE, set in .cargo/config.toml).
fubbik-api = { path = "../../crates/fubbik-api" }
fubbik-db = { path = "../../crates/fubbik-db" }
fubbik-config = { path = "../../crates/fubbik-config" }
fubbik-ai = { path = "../../crates/fubbik-ai" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "process", "signal"] }
tracing = "0.1"
# Computer stats for the Projects page (`system.rs`).
sysinfo = { version = "0.35", default-features = false, features = ["system", "disk", "network"] }
# The app's own MCP server (`mcp.rs`): POST /mcp on 127.0.0.1:3100.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
# GPUI's test harness (TestAppContext, simulated keystrokes) for the UI tests.
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }
