name: rust
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          # Required: the postgres image only auto-creates a database matching
          # POSTGRES_DB (defaults to "postgres"). sqlx's test harness connects
          # directly to the database named in DATABASE_URL with no admin-db
          # fallback, so without this every #[sqlx::test] fails with
          # "database fubbik_rs does not exist" on a fresh CI run.
          POSTGRES_DB: fubbik_rs
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fubbik_rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
