name: rust
on:
    push:
        paths-ignore:
            - "docs/**"
            - "**/*.md"
    pull_request:
        paths-ignore:
            - "docs/**"
            - "**/*.md"

jobs:
    test:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: postgres://postgres:password@localhost:5434/fubbik_rs
            SQLX_OFFLINE: "true"
        steps:
            - uses: actions/checkout@v4
            - name: Start production-faithful test database
              run: ./scripts/rust-test-db.sh start
            # No explicit toolchain-install action: ubuntu-latest runners ship
            # rustup preinstalled, and rustup auto-installs the exact toolchain
            # (and its rustfmt/clippy components) pinned in rust-toolchain.toml
            # the first time cargo/rustup is invoked in this directory.
            # `dtolnay/rust-toolchain@stable` installed whatever "stable" happened
            # to be that day instead, silently downloading a second toolchain
            # alongside the pinned one.
            - run: rustup show
            - run: cargo fmt --check
            - run: cargo clippy --all-targets -- -D warnings
            - run: cargo test --workspace
            - name: Prove operation without Apache AGE
              run: |
                  ./scripts/rust-test-db.sh stop
                  ./scripts/rust-test-db.sh start without-age
                  FUBBIK_EXPECT_NO_AGE=1 cargo test -p fubbik-db --test age unavailable_profile_degrades_without_error -- --exact
            - name: Stop test database
              if: always()
              run: ./scripts/rust-test-db.sh stop
