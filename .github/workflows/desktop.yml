name: desktop
on:
    push:
        paths:
            - "apps/desktop/**"
            # The embedded backend links these crates and their sqlx data.
            - "crates/fubbik-api/**"
            - "crates/fubbik-db/**"
            - "crates/fubbik-core/**"
            - "crates/fubbik-contracts/**"
            - "crates/fubbik-config/**"
            - "crates/fubbik-ai/**"
            - ".sqlx/**"
            - ".github/workflows/desktop.yml"
            - "rust-toolchain.toml"
    pull_request:
        paths:
            - "apps/desktop/**"
            # The embedded backend links these crates and their sqlx data.
            - "crates/fubbik-api/**"
            - "crates/fubbik-db/**"
            - "crates/fubbik-core/**"
            - "crates/fubbik-contracts/**"
            - "crates/fubbik-config/**"
            - "crates/fubbik-ai/**"
            - ".sqlx/**"
            - ".github/workflows/desktop.yml"
            - "rust-toolchain.toml"

# apps/desktop is its own cargo workspace (GPUI is macOS-first and heavy), so
# it builds here on a macOS runner and stays out of rust.yml.
jobs:
    test:
        runs-on: macos-latest
        defaults:
            run:
                working-directory: apps/desktop
        steps:
            - uses: actions/checkout@v4
            # rustup installs the toolchain pinned in rust-toolchain.toml.
            - run: rustup show
            # libghostty-vt 0.2.2 runs `zig` from PATH and needs exactly 0.15.2;
            # tmux lets the tmux tests run instead of skipping.
            # postgresql@18 + pgvector: the built-in server's real-cluster test
            # (backend::tests::a_fresh_cluster_starts_migrates_and_stops) runs
            # instead of skipping.
            - name: Install Zig 0.15, tmux and PostgreSQL 18 with pgvector
              run: |
                  brew install zig@0.15 tmux postgresql@18 pgvector
                  echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: apps/desktop
            - run: cargo fmt --check
            - run: cargo clippy --all-targets -- -D warnings
            - run: cargo test
