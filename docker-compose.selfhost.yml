# Fubbik Self-Hosting
#
# Usage:
#   docker compose -f docker-compose.selfhost.yml up -d
#   Open http://localhost:4718 (web) and http://localhost:4717 (API)
#
# Custom ports:
#   FUBBIK_WEB_PORT=8080 FUBBIK_API_PORT=8081 docker compose -f docker-compose.selfhost.yml up -d
#
# First run with sample data:
#   SEED_DATABASE=true docker compose -f docker-compose.selfhost.yml up -d
#
# No external network calls. All data stays local.
# Ollama (optional, local): set OLLAMA_URL to your local Ollama instance.
#
# Auth: FUBBIK_IMPLICIT_DEV_SESSION + VITE_FUBBIK_IMPLICIT_DEV_SESSION expose a dev user in the
# UI without Sign In. Do not enable on an internet-exposed host.

services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: fubbik-postgres:pg18-vector-age
    environment:
      POSTGRES_DB: fubbik
      POSTGRES_USER: fubbik
      POSTGRES_PASSWORD: fubbik
    entrypoint:
      - sh
      - -c
      - |
        echo "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS age;" > /docker-entrypoint-initdb.d/01-extensions.sql
        exec docker-entrypoint.sh postgres
    volumes:
      - fubbik_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fubbik"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: docker/build/server.Dockerfile
    image: pontusg45/fubbik-server:latest
    ports:
      - "${FUBBIK_API_PORT:-4717}:3000"
    environment:
      DATABASE_URL: postgresql://fubbik:fubbik@db:5432/fubbik
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-this-to-a-random-string-32ch}
      BETTER_AUTH_URL: http://localhost:${FUBBIK_API_PORT:-4717}
      CORS_ORIGIN: http://localhost:${FUBBIK_WEB_PORT:-4718}
      # Match NODE_ENV=production container: API injects implicit dev-user for unauthenticated /api routes
      FUBBIK_IMPLICIT_DEV_SESSION: "true"
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # Explicitly disable external services
      OPENAI_API_KEY: ""
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      PORT: "3000"
      SEED_DATABASE: ${SEED_DATABASE:-false}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/build/web.Dockerfile
      args:
        VITE_SERVER_URL: http://localhost:${FUBBIK_API_PORT:-4717}
        VITE_FUBBIK_IMPLICIT_DEV_SESSION: "true"
    image: pontusg45/fubbik-web:latest
    ports:
      - "${FUBBIK_WEB_PORT:-4718}:3001"
    environment:
      PORT: "3001"
      RUNTIME_SERVER_URL: http://localhost:${FUBBIK_API_PORT:-4717}
    depends_on:
      - server

volumes:
  fubbik_data:
