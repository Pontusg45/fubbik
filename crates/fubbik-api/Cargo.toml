[package]
name = "fubbik-api"
edition.workspace = true
version.workspace = true

[dependencies]
argon2 = "0.5"
axum = { workspace = true, features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx.workspace = true
thiserror.workspace = true
time = "0.3"
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tracing.workspace = true
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
fubbik-core = { path = "../fubbik-core" }
fubbik-db = { path = "../fubbik-db" }
fubbik-ai = { path = "../fubbik-ai" }
# `vocabulary::suggest` now calls Ollama through `fubbik_ai::OllamaClient`;
# this dependency remains for `tests/differential.rs`'s direct HTTP calls.
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
