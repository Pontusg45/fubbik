[package]
name = "fubbik-api"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
argon2 = "0.5"
axum = { workspace = true, features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
scrypt = "0.11"
sqlx.workspace = true
subtle = "2"
thiserror.workspace = true
time = "0.3"
tokio.workspace = true
tokio-stream.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["catch-panic", "cors", "request-id", "trace"] }
tracing.workspace = true
unicode-normalization = "0.1"
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
fubbik-core = { path = "../fubbik-core" }
fubbik-contracts = { path = "../fubbik-contracts" }
fubbik-db = { path = "../fubbik-db" }
fubbik-ai = { path = "../fubbik-ai" }
fubbik-config = { path = "../fubbik-config" }
# `vocabulary::suggest` now calls Ollama through `fubbik_ai::OllamaClient`;
# this dependency remains for `tests/differential.rs`'s direct HTTP calls.
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
tempfile = "3"
